# ANNOTATED EXAMPLE — shape documentation, NOT executed by CI (a go_test
# declaration runs against real modules; the ACCEPT path is the fixture
# proof in engine-contracts, which uses the real fixture defs).
#
# A def declares the fork's validation contract; go_test packages are
# EXPLICIT (./... is the forbidden silent fallback, #564).

name: example                        # = this file's stem
validation:
  go_test:
    - module: .                      # the Go module to run in
      packages: [./okpkg, ./badpkg]  # EXPLICIT list, never ./...
      timeout: 60s
