# What THIS repo delivers to a cluster:
#   - the template CR (template.yaml)
#   - the engine payload ConfigMaps (three-tier 3a stage 3): scripts/checks/
#     hooks/skill — CODE, delivered under the SAME names the chart's mounts
#     consume (forkMaintenance.*ConfigMap values), so a deployment running
#     forkMaintenance.payload=external mounts repo-delivered bytes.
#     fork-maintenance-defs is NOT here: defs are per-env DATA (config tier,
#     k8s-config platform/harmostes/config overlays).
# Explicit file lists, never globs: scripts/tests and checks/testdata are
# CI fixtures, not engine payload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - template.yaml
  - resolver.yaml   # the fork-conflict-resolver — a COMPONENT OF THIS WORKFLOW
# Hashing is ON by default: the RESOLVER-scoped CMs get content-hash names
# and kustomize rewrites the resolver Deployment's refs → any edit rolls the
# resolver pod automatically. The POOL-consumed CMs pin STATIC names per
# generator (the chart-values mount contract: forkMaintenance.*ConfigMap).
configMapGenerator:
  - name: resolver-scripts
    options:
      disableNameSuffixHash: false
    files:
      - scripts/sync-fork.sh
      - scripts/mapping-mode.sh
      - scripts/conflict-event.sh
      - scripts/derive-release-version.sh
      - scripts/backport.sh
      - scripts/git-host.sh
      - scripts/resolve-conflict.sh
      - scripts/conflict-subscriber.py
      - scripts/generate-manifest.sh
      - scripts/verify-patches.sh
      - scripts/divergence-track.sh
  - name: resolver-checks
    options:
      disableNameSuffixHash: false
    files:
      - checks/validate-fork.sh
      - checks/gate-resolved.sh
  - name: resolver-hooks
    options:
      disableNameSuffixHash: false
    files:
      - hooks/dapr.sh
      - hooks/signoz.sh
  - name: resolver-skill
    options:
      disableNameSuffixHash: false
    files:
      - SKILL.md=skill/SKILL.md
      - conflict-resolution.md=skill/references/conflict-resolution.md
      - safeguards.md=skill/references/safeguards.md
      - architecture.md=skill/references/architecture.md
  - name: litellm-provider-extension
    options:
      disableNameSuffixHash: false
    files:
      - index.ts=litellm-provider/index.ts
      - fallbacks.ts=litellm-provider/fallbacks.ts
      - sampling.ts=litellm-provider/sampling.ts
      - package.json=litellm-provider/package.json
      - factory.test.ts=litellm-provider/factory.test.ts
      - fallbacks.test.ts=litellm-provider/fallbacks.test.ts
      - sampling.test.ts=litellm-provider/sampling.test.ts
      - thinking.test.ts=litellm-provider/thinking.test.ts
      - thinking.ts=litellm-provider/thinking.ts
  # ── pool-scoped STATIC copies (unchanged contract)
  - name: fork-maintenance-scripts
    options:
      disableNameSuffixHash: true   # STATIC — the pool mounts this name (values contract)
    files:
      - scripts/sync-fork.sh
      - scripts/mapping-mode.sh
      - scripts/conflict-event.sh
      - scripts/derive-release-version.sh
      - scripts/backport.sh
      - scripts/git-host.sh
      - scripts/resolve-conflict.sh
      - scripts/conflict-subscriber.py
      - scripts/generate-manifest.sh
      - scripts/verify-patches.sh
      - scripts/divergence-track.sh
  - name: fork-maintenance-checks
    options:
      disableNameSuffixHash: true   # STATIC — the pool mounts this name (values contract)
    files:
      - checks/validate-fork.sh
      - checks/gate-resolved.sh
  - name: fork-maintenance-hooks
    options:
      disableNameSuffixHash: true   # STATIC — the pool mounts this name (values contract)
    files:
      - hooks/dapr.sh
      - hooks/signoz.sh
  - name: fork-maintenance-skill
    options:
      disableNameSuffixHash: true   # STATIC — the pool mounts this name (values contract)
    files:
      - SKILL.md=skill/SKILL.md
      - conflict-resolution.md=skill/references/conflict-resolution.md
      - safeguards.md=skill/references/safeguards.md
      - architecture.md=skill/references/architecture.md
